# Publishes the repository as-is to GitLab Pages. No build, no dependencies,
# no internet required — suitable for air-gapped GitLab instances.
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r index.html assets events.json config.json public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
